name: CI adjusted (non-blocking coverage)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest coverage pytest-cov
      - name: Run tests with coverage (enforce threshold)
        working-directory: pfinal
        run: |
          pytest -q --cov=app --cov-config=pfinal/.coveragerc --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=80
      - name: Report coverage
        run: |
          echo "Coverage report:" && coverage report -m
