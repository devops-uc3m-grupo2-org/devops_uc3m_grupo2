name: FastAPI CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pfinal/requirements.txt
          pip install pytest pytest-cov coverage flake8 bandit

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test_db" >> $GITHUB_ENV
          echo "PYTHONPATH=$PWD/pfinal" >> $GITHUB_ENV
          echo "SEND_EMAILS=false" >> $GITHUB_ENV

      - name: Flake8 lint
        run: flake8 pfinal/app --config pfinal/.flake8 || true

      - name: Bandit security scan
        run: bandit -r pfinal/app -ll -q || true

      - name: Radon complexity
        run: |
          pip install radon -q
          radon cc pfinal/app -a || true

      - name: pip-audit dependency audit
        run: |
          pip install pip-audit -q
          pip-audit -r pfinal/requirements.txt || true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: ESLint lint
        run: |
          npm install -g eslint@8
          eslint pfinal/static/app.js -c pfinal/static/.eslintrc.json || true

      - name: Run tests
        working-directory: pfinal
        run: |
          pytest -q --cov=app --cov-config=pfinal/.coveragerc --cov-report=term --cov-report=xml:pfinal/coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: pfinal/coverage.xml
