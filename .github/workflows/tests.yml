name: FastAPI CI

#En qué Acciones
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    #Levanta una base de datos PostgreSQL real dentro del runner de GitHub Actions
    services:
      postgres:
        image: postgres:15
        #Configura la base de datos inicial
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        #GitHub espera a que Postgres esté listo antes de correr tests, le decimos cada cuánto chequear, cuánto esperar el intento y cuántas veces intentar.
        options: >-
          --health-cmd="pg_isready -U test" 
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          
    steps:
      #Descarga el repositorio para poder usarlo
      - name: Checkout repo
        uses: actions/checkout@v6
      #Configura Python
      - name: Set up Python
      #Utiliza pip para acelerar ejecucción
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'

      #Instala todo lo específicado en los requirements más función para mostrar cobertura del código
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pfinal/requirements.txt
          pip install pytest pytest-cov flake8 bandit

      #Define las variables de entorno del pipeline
      #Añade el directorio al proyecto para que los imports sean correctos (hecho gracias a debugging)
      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/test_db" >> $GITHUB_ENV
          echo "PYTHONPATH=$PWD/pfinal" >> $GITHUB_ENV
          echo "SEND_EMAILS=false" >> $GITHUB_ENV

      # Calidad de código Python — Flake8
      - name: Flake8 lint
        run: flake8 pfinal/app --config pfinal/.flake8 || true

      # Seguridad Python — Bandit
      - name: Bandit security scan
        run: bandit -r pfinal/app -ll -q || true

      # Complejidad de código — Radon
      - name: Radon complexity
        run: |
          pip install radon -q
          radon cc pfinal/app -a || true

      # Auditoría de dependencias — pip-audit
      - name: pip-audit dependency audit
        run: |
          pip install pip-audit -q
          pip-audit -r pfinal/requirements.txt || true

      # Calidad de código JavaScript — ESLint
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: ESLint lint
        run: |
          npm install -g eslint@8
          eslint pfinal/static/app.js -c pfinal/static/.eslintrc.json || true

      #Corre los tests y genera informe de cobertura
      - name: Run tests
        run: pytest pfinal/app/tests -v --cov=app --cov-report=term --cov-report=xml:pfinal/coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: pfinal/coverage.xml